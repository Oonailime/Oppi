services:
  postgres:
    image: postgres:17-alpine
    container_name: dataprev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataprev
      POSTGRES_USER: dataprev
      POSTGRES_PASSWORD: dataprev
    ports:
      - "5433:5432"
    volumes:
      - dataprev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataprev -d dataprev"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dataprev_postgres_data:
